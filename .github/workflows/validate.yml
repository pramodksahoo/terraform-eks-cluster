name: Validate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -recursive -check -diff

  discover:
    name: Discover directories
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v5

      # Every directory holding a versions.tf is a module, layer or example and
      # must validate. Discovering them means a new module is covered without
      # anyone remembering to edit this workflow.
      - id: find
        run: |
          dirs=$(find modules layers -name versions.tf -not -path '*/.terraform/*' \
                 -exec dirname {} \; | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "$dirs" | jq .

  validate:
    name: Validate ${{ matrix.dir }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      # -backend=false: validation needs the providers and modules, never the
      # state backend, and CI has no credentials for it.
      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate

  examples:
    name: Validate examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Validate every example
        run: |
          rc=0
          while read -r dir; do
            echo "::group::$dir"
            if terraform -chdir="$dir" init -backend=false >/dev/null \
               && terraform -chdir="$dir" validate; then
              echo "PASS $dir"
            else
              echo "::error::$dir failed validation"
              rc=1
            fi
            echo "::endgroup::"
          done < <(find modules/*/examples -mindepth 1 -maxdepth 1 -type d | sort)
          exit $rc

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.60.0

      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: tflint --recursive --config="$(pwd)/.tflint.hcl" --format compact

  security:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: trivy.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: "**/.terraform"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
